<!doctype html>
<html lang="da">
  <head>
    <meta charset="UTF-8" />
    <title>Form detection</title>
  </head>
  <body>
    <form name="tilmeld" data-netlify="true" hidden>
      <input type="hidden" name="form-name" value="tilmeld" />
      <input name="navn" />
      <input name="email" />
      <input name="telefon" />
      <select name="hold"></select>
      <textarea name="kommentar"></textarea>
      <input name="samtykke" type="checkbox" />
    </form>

    <form name="kontakt" data-netlify="true" hidden>
      <input type="hidden" name="form-name" value="kontakt" />

      <input name="email" />
      <input name="telefon" />
      <textarea name="besked"></textarea>
      <input name="samtykke" type="checkbox" />
    </form>
  </body>
</html>
